name: Bug Report
description: Сообщить о баге
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Описание бага
      placeholder: Что произошло, что ожидалось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: v1.0.0-beta
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: podman compose logs <service>, /health, ошибки в консоли
