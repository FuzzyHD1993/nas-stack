global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:9091']
  - job_name: 'books-service'
    static_configs:
      - targets: ['books-service:8087']
  - job_name: 'torrent-service'
    static_configs:
      - targets: ['torrent-service:8081']
  - job_name: 'stats-service'
    static_configs:
      - targets: ['stats-service:8082']
  - job_name: 'history-service'
    static_configs:
      - targets: ['history-service:8085']
  - job_name: 'scheduler-service'
    static_configs:
      - targets: ['scheduler-service:8084']
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8086']
  - job_name: 'search-service'
    static_configs:
      - targets: ['search-service:8088']
  - job_name: 'youtube-service'
    static_configs:
      - targets: ['youtube-service:8089']
  - job_name: 'media-service'
    static_configs:
      - targets: ['media-service:8091']
  - job_name: 'music-service'
    static_configs:
      - targets: ['music-service:8092']
  - job_name: 'host-agent'
    static_configs:
      - targets: ['host.containers.internal:9998']
